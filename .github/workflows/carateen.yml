name: Sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Carateen/**'
      - 'CimaClub/**'
      - 'MySeed/**'
      - 'Iwaatch/**'
      - 'SpacePowerFan/**'
      - 'ArabicCartoon/**'
      - 'Shooot/**'
      - 'OnlineSportLive/**'
      - 'shared/**'
      - 'catalog-policy.json'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'repo.json'
      - 'scripts/publish_sources.py'
      - 'scripts/test_publish_sources.py'
      - '.github/workflows/carateen.yml'

concurrency:
  group: sources-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/checkout@v4
        with:
          ref: builds
          path: dist
      - uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Test and package managed providers
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew :Carateen:testDebugUnitTest :MySeed:testDebugUnitTest :Carateen:writeCacheEntry :CimaClub:writeCacheEntry :MySeed:writeCacheEntry :Iwaatch:writeCacheEntry :SpacePowerFan:writeCacheEntry :ArabicCartoon:writeCacheEntry :Shooot:writeCacheEntry :OnlineSportLive:writeCacheEntry --console=plain
      - name: Merge packages and update organized repository catalogs
        run: |
          python3 -m unittest discover -s src/scripts -p test_publish_sources.py
          python3 src/scripts/publish_sources.py src dist
      - uses: actions/upload-artifact@v4
        with:
          name: Arabic-Sources
          path: |
            dist/*.cs3
            src/Carateen/build/reports/tests/testDebugUnitTest/
            src/MySeed/build/reports/tests/testDebugUnitTest/
      - name: Publish to the builds branch
        working-directory: dist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.cs3' '*.json'
          if ! git diff --cached --quiet; then
            git commit -m "Build Arabic sources from ${GITHUB_SHA}"
            git push origin HEAD:builds
          fi
